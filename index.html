<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STM SOFTWARE | Certificate Verification</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#ececf3;
    font-family:Arial, Helvetica, sans-serif;
}

.header{
    text-align:center;
    font-size:34px;
    font-weight:300;
    color:#444;
    margin:25px 0;
}

.card{
    width:86%;
    max-width:620px;
    margin:0 auto 30px;
    background:#fff;
    padding:35px 28px;
    border-radius:0;
    box-shadow:0 2px 8px rgba(0,0,0,.10);
}

.valid{
    color:#00A651;
    font-size:26px;
    font-weight:700;
    margin-bottom:30px;
}

.title{
    font-size:17px;
    font-weight:700;
    color:#444;
    margin-top:22px;
}

.value{
    font-size:16px;
    color:#555;
    margin-top:6px;
    line-height:1.5;
}

@media (max-width:768px){

.header{
    font-size:30px;
}

.card{
    width:90%;
    padding:28px 20px;
}

.valid{
    font-size:24px;
}

.title{
    font-size:16px;
}

.value{
    font-size:15px;
}

}

</style>

</head>

<body>

<div class="header">STM SOFTWARE</div>

<div class="card">

<div class="valid">Valid Certificate</div>

<div class="title">Certificate Number</div>
<div class="value">LS-AD-2026-460009</div>

<div class="title">Certificate Validity</div>
<div class="value">20/07/2029</div>

<div class="title">Attendee Name</div>
<div class="value">TAJGUL HIJRAN</div>

<div class="title">Course Name</div>
<div class="value">
Lifting Supervisor (As Per ADNOC HSE-PSW-CP19)
</div>

</div>

</body>
</html>
