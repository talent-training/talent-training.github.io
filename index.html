<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STM SOFTWARE | Certificate Verification</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#ececf3;
    font-family:Arial, Helvetica, sans-serif;
}

.header{
    text-align:center;
    font-size:48px;
    font-weight:300;
    color:#3d3d3d;
    margin:38px 0 34px;
    letter-spacing:1px;
}

.card{
    width:92%;
    max-width:670px;
    margin:0 auto 40px;
    background:#ffffff;
    padding:48px 40px;
    border-radius:3px;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.valid{
    color:#00A651;
    font-size:38px;
    font-weight:700;
    margin-bottom:42px;
}

.title{
    font-size:20px;
    font-weight:700;
    color:#444;
    margin-top:28px;
}

.value{
    font-size:18px;
    color:#555;
    margin-top:8px;
    line-height:1.7;
}

@media (max-width:768px){

.header{
    font-size:42px;
    margin:30px 0 28px;
}

.card{
    width:94%;
    padding:38px 22px;
}

.valid{
    font-size:32px;
}

.title{
    font-size:18px;
}

.value{
    font-size:17px;
}

}
</style>

</head>

<body>

<div class="header">STM SOFTWARE</div>

<div class="card">

<div class="valid">Valid Certificate</div>

<div class="title">Certificate Number</div>
<div class="value">LS-AD-2026-460009</div>

<div class="title">Certificate Validity</div>
<div class="value">20/07/2029</div>

<div class="title">Attendee Name</div>
<div class="value">TAJGUL HIJRAN</div>

<div class="title">Course Name</div>
<div class="value">Lifting Supervisor (As Per ADNOC HSE-PSW-CP19)</div>

</div>

</body>
</html>
